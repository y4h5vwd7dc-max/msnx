<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAISONAX</title>
<meta name="theme-color" content="#04050b">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#04050b;--card:rgba(15,17,26,.85);--cyan:#00f3ff;--cyan-soft:rgba(0,243,255,.12);--text:#f0f3f8;--muted:#9aa4b6;--line:rgba(0,243,255,.22);
--grad:linear-gradient(135deg,#00f3ff,#6c8cff 70%,#a78bfa);
--new:#ffd84d;--prog:#00f3ff;--done:#3dffa0;--rej:#ff5d6c;
--sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;position:relative;
padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
radial-gradient(700px 420px at 85% -8%,rgba(0,243,255,.16),transparent 70%),
radial-gradient(600px 420px at -10% 45%,rgba(108,140,255,.12),transparent 70%),
radial-gradient(520px 380px at 100% 100%,rgba(167,139,250,.12),transparent 70%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(0,243,255,.14) 1px,transparent 1.2px);background-size:26px 26px;
-webkit-mask-image:linear-gradient(#000,transparent 65%);mask-image:linear-gradient(#000,transparent 65%)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#app{position:relative;z-index:1;max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,243,255,.1);flex:none;
background:linear-gradient(180deg,rgba(4,5,11,.7),transparent)}
.logo{display:inline-flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.05rem;letter-spacing:.2em;color:#fff;line-height:1}
.lg-mark{width:32px;height:32px;flex:none;overflow:visible;filter:drop-shadow(0 0 8px rgba(0,243,255,.45))}
.lg-orb{transform-box:view-box;transform-origin:50% 50%;animation:lgspin 16s linear infinite}
.lg-node{filter:drop-shadow(0 0 4px #fff);animation:lgnode 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.lg-word span{background:linear-gradient(90deg,#00f3ff,#6c8cff 55%,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 10px rgba(0,243,255,.35))}
@keyframes lgspin{to{transform:rotate(360deg)}}
@keyframes lgnode{50%{transform:scale(1.35);opacity:.8}}
@keyframes pulse{50%{opacity:.35}}
.role{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);background:rgba(0,243,255,.06);border:1px solid var(--line);border-radius:50px;padding:.35rem .9rem}
.role::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--cyan);margin-right:.55rem;box-shadow:0 0 4px var(--cyan);animation:pulse 2s ease-in-out infinite;vertical-align:middle}
nav{display:flex;gap:6px;padding:12px 16px 4px;flex:none}
nav:empty{display:none}
.tab,.chip{flex:1;padding:.7rem;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:var(--muted);cursor:pointer;font-weight:700;font-size:.86rem;letter-spacing:.04em;transition:.2s}
.chip{flex:none;padding:.5rem 1rem;font-size:.78rem;white-space:nowrap;font-family:var(--mono)}
.tab.on,.chip.on{background:rgba(0,243,255,.1);color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 18px rgba(0,243,255,.18)}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 18px;display:flex;flex-direction:column;gap:12px}
main.chatmode{overflow:hidden;padding-bottom:10px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:none}
.card{flex:none;position:relative;background:linear-gradient(160deg,rgba(20,24,38,.94),rgba(8,9,15,.95));border:1px solid rgba(0,243,255,.18);border-radius:20px;padding:16px;
box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05)}
.order{cursor:pointer;display:flex;flex-direction:column;gap:7px;text-align:left;width:100%;transition:border-color .25s,transform .25s}
.order:active{border-color:var(--cyan);transform:scale(.99)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.num{font-family:var(--mono);font-weight:700;letter-spacing:.06em}
.order b{font-weight:800}
.sub{color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.badge{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;padding:.28rem .8rem;border-radius:50px;border:1px solid currentColor;white-space:nowrap;background:rgba(255,255,255,.03)}
.NEW{color:var(--new)}.IN_PROGRESS{color:var(--prog)}.COMPLETED{color:var(--done)}.REJECTED{color:var(--rej)}
label{display:block;font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input,textarea,select{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:.8rem .9rem;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,243,255,.12)}
select option{background:#0b0d16}
textarea{resize:none;min-height:120px}
.field{margin-bottom:14px}
.btn{width:100%;padding:.95rem;border:0;border-radius:12px;background:var(--grad);color:#03060c;font-weight:800;letter-spacing:.06em;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px;box-shadow:0 8px 30px rgba(0,243,255,.28);transition:transform .2s,filter .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6}
.spin{width:16px;height:16px;border:2px solid #03060c80;border-top-color:#03060c;border-radius:50%;animation:r .7s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.back{flex:none;background:none;border:0;color:var(--cyan);font-family:var(--mono);font-size:.8rem;letter-spacing:.1em;font-weight:700;cursor:pointer;padding:2px 0;text-align:left}
.det{padding:0}
.det summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;padding:14px 16px}
.det summary::-webkit-details-marker{display:none}
.det summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--cyan);border-bottom:2px solid var(--cyan);transform:rotate(45deg);margin:-4px 2px 0 6px;transition:transform .2s;flex:none}
.det[open] summary::after{transform:rotate(225deg);margin-top:4px}
.det .body{padding:0 16px 16px;max-height:42vh;overflow-y:auto}
.info{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:.88rem}
.info dt{color:var(--muted);font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.info dd{word-break:break-word}
.info a,.info button.lnk{color:var(--cyan);background:none;border:0;cursor:pointer;text-decoration:underline;text-align:left;padding:0}
.chatcard{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px}
.chat{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column;gap:8px;padding:6px 4px}
.msg{max-width:84%;padding:.6rem .8rem;border-radius:16px;font-size:.92rem;white-space:pre-wrap;word-break:break-word}
.msg small{display:block;font-family:var(--mono);font-size:.62rem;color:var(--muted);margin-top:3px}
.me{align-self:flex-end;background:linear-gradient(135deg,rgba(0,243,255,.2),rgba(167,139,250,.2));border:1px solid rgba(0,243,255,.3);border-bottom-right-radius:5px}
.them{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-bottom-left-radius:5px}
.send{flex:none;display:flex;gap:8px;margin-top:8px;padding-top:10px;border-top:1px solid rgba(0,243,255,.1)}
.send input{flex:1}
.send button{width:auto;padding:0 18px}
.att{margin-bottom:4px}
.att img,.att video{max-width:100%;max-height:260px;border-radius:12px;display:block}
.att audio{width:100%;max-width:240px}
.att .ph{color:var(--muted);font-size:.8rem;padding:6px 0}
.fbtn{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--text);cursor:pointer;text-align:left;max-width:100%}
.fbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn small{display:inline;margin:0}
.send .clip{background:rgba(0,243,255,.08);border:1px solid var(--line);color:var(--cyan);font-size:1.1rem;padding:0 13px;box-shadow:none}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:.9rem;margin:auto}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);pointer-events:none;max-width:92vw;text-align:center;background:rgba(11,13,22,.95);border:1px solid var(--cyan);box-shadow:0 0 24px rgba(0,243,255,.25);padding:.65rem 1.1rem;border-radius:12px;font-size:.88rem;z-index:9}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}.lg-orb,.lg-node,.role::before{animation:none}}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);margin-left:8px;vertical-align:middle}
.prev{color:var(--muted);font-size:.8rem;border-top:1px dashed rgba(255,255,255,.1);padding-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prev.new{color:var(--cyan)}
.search{flex:none}
.day{align-self:center;font-family:var(--mono);font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:rgba(255,255,255,.05);border-radius:50px;padding:.2rem .8rem;margin:6px 0}
.send textarea{flex:1;min-height:46px;height:46px;max-height:110px;padding:.7rem .9rem;line-height:1.35}
.send{align-items:flex-end}
.send button{height:46px}
.att img{cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:20;background:rgba(2,3,8,.94);display:flex;align-items:center;justify-content:center;padding:12px}
.lb img{max-width:100%;max-height:100%;border-radius:12px}
.quick{flex:none;display:flex;gap:6px;overflow-x:auto;padding:8px 0 0}
.quick button{flex:none;background:rgba(0,243,255,.06);border:1px solid var(--line);color:var(--cyan);border-radius:50px;padding:.35rem .8rem;font-size:.75rem;cursor:pointer;white-space:nowrap}
.reason{flex:none;border:1px solid rgba(255,93,108,.45);background:linear-gradient(160deg,rgba(255,93,108,.12),rgba(255,93,108,.04));border-radius:16px;padding:10px 14px;font-size:.88rem;word-break:break-word}
.reason b{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--rej);margin-bottom:3px}
#reason:empty{display:none}
.prev.rej{color:var(--rej);border-top-color:rgba(255,93,108,.3);white-space:normal}
.modal{position:fixed;inset:0;z-index:30;background:rgba(2,3,8,.82);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal .card{width:100%;max-width:520px}
.modal h3{font-size:1.05rem;margin-bottom:4px}
.modal p{color:var(--muted);font-size:.85rem;margin-bottom:12px}
.modal .acts{display:flex;gap:8px;margin-top:12px}
.modal .acts .btn{flex:1}
.btn.btn.danger{background:linear-gradient(135deg,#ff5d6c,#ff8a5d);box-shadow:0 8px 30px rgba(255,93,108,.28)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
main>*{animation:fade .3s ease both}
.skel{flex:none;height:112px;border-radius:20px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.1),rgba(255,255,255,.04));background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.tl{list-style:none;margin:16px 0 0 4px;border-left:1px dashed rgba(0,243,255,.3);padding-left:16px;display:flex;flex-direction:column;gap:11px}
.tl li{position:relative;font-size:.82rem}
.tl li::before{content:"";position:absolute;left:-21px;top:6px;width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.tl small{display:block;color:var(--muted);font-family:var(--mono);font-size:.65rem}
.tl em{display:block;color:var(--text);font-style:normal;opacity:.85}
.emptyx{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:34px 14px;margin:auto;color:var(--muted);font-size:.9rem}
.emptyx .ic{font-size:2.3rem;filter:drop-shadow(0 0 12px rgba(0,243,255,.45))}
.emptyx .btn{max-width:260px;margin-top:6px}
.note textarea{min-height:72px}
.offline{flex:none;text-align:center;font-family:var(--mono);font-size:.7rem;color:var(--rej);padding:4px}

.hbar{display:flex;align-items:center;gap:8px}
.hbtn{position:relative;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(0,243,255,.06);color:var(--text);font-size:1.05rem;cursor:pointer;line-height:1}
.bn{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--rej);color:#fff;font:700 .62rem var(--mono);display:flex;align-items:center;justify-content:center;padding:0 4px;font-style:normal}
.bn[hidden]{display:none}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(2,3,8,.82);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.sheet .card{width:100%;max-width:560px;max-height:82vh;overflow-y:auto;position:relative}
.sheet .x{position:absolute;right:12px;top:10px;background:none;border:0;color:var(--muted);font-size:1.1rem;cursor:pointer}
.sheet h3{margin-bottom:10px;padding-right:28px}
.nt,.act,.mi{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:.75rem .9rem;margin-bottom:6px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:var(--text);cursor:pointer;font-size:.9rem}
.nt.new{border-color:var(--cyan);background:rgba(0,243,255,.07)}
.nt small{color:var(--muted);font-family:var(--mono);font-size:.62rem;white-space:nowrap}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;padding:.6rem;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);color:var(--muted);font-weight:700;cursor:pointer}
.seg button.on{border-color:var(--cyan);color:var(--cyan);background:rgba(0,243,255,.1)}
.emo{display:flex;gap:6px;justify-content:space-between;margin-bottom:10px}
.emo button{flex:1;font-size:1.35rem;padding:.5rem 0;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);cursor:pointer}
.tag{display:inline-block;font-family:var(--mono);font-size:.62rem;letter-spacing:.04em;padding:.12rem .55rem;border-radius:50px;border:1px solid rgba(255,255,255,.18);color:var(--muted);margin:0 4px 4px 0}
.tag.as{color:var(--cyan);border-color:var(--line)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tags button{font-size:.75rem;padding:.3rem .7rem;border-radius:50px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.03);color:var(--muted);cursor:pointer}
.tags button.on{border-color:var(--cyan);color:var(--cyan);background:rgba(0,243,255,.1)}
.meta{display:flex;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lst{display:flex;flex-direction:column;gap:12px}
.chk{display:inline-block;width:16px;height:16px;border-radius:5px;border:1.5px solid var(--cyan);margin-right:8px;vertical-align:-3px}
.chk.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.order.sel{border-color:var(--cyan);box-shadow:0 0 18px rgba(0,243,255,.2)}
.bulk{position:sticky;bottom:0;z-index:5;margin-top:4px;padding:10px;border-radius:16px;border:1px solid var(--cyan);background:rgba(8,10,18,.96);display:flex;flex-direction:column;gap:8px}
.bulk .bb{display:flex;gap:6px;flex-wrap:wrap}
.bulk .bb button{flex:1;min-width:30%;padding:.55rem .4rem;border-radius:10px;border:1px solid var(--line);background:rgba(0,243,255,.07);color:var(--cyan);font-size:.75rem;font-weight:700;cursor:pointer}
.nm{font-family:var(--mono);font-size:.62rem;color:var(--cyan);margin-bottom:2px;letter-spacing:.04em}
.quote{border-left:2px solid var(--cyan);padding:2px 8px;margin-bottom:5px;font-size:.78rem;color:var(--muted);background:rgba(255,255,255,.04);border-radius:6px;cursor:pointer}
.quote b{display:block;color:var(--cyan);font-size:.65rem;font-family:var(--mono)}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.rx:empty{display:none}
.rx .r{font-size:.72rem;padding:.05rem .45rem;border-radius:50px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);cursor:pointer}
.rx .r.mine{border-color:var(--cyan);background:rgba(0,243,255,.12)}
.tk{font-family:var(--mono);margin-left:6px;color:var(--muted)}
.tk.rd{color:var(--cyan)}
.msg.internal{border:1px dashed var(--new);background:rgba(255,216,77,.08)}
.msg.internal::before{content:"🔒 только команда";display:block;font-family:var(--mono);font-size:.58rem;color:var(--new);margin-bottom:2px}
.msg.hit{outline:2px solid var(--new)}
.msg.flash{animation:fl 1s}
@keyframes fl{0%,60%{box-shadow:0 0 0 3px var(--cyan)}}
.typing{flex:none;font-size:.75rem;color:var(--cyan);font-family:var(--mono);padding:2px 6px}
.typing[hidden],.replybar[hidden],.csearch[hidden]{display:none}
.replybar{flex:none;display:flex;align-items:center;gap:8px;border-left:2px solid var(--cyan);background:rgba(255,255,255,.05);border-radius:8px;padding:5px 8px;font-size:.78rem;color:var(--muted);margin-top:6px}
.replybar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.replybar button,.csearch button{background:none;border:0;color:var(--cyan);font-size:1rem;cursor:pointer}
.csearch{flex:none;display:flex;gap:6px;align-items:center;margin-bottom:6px}
.csearch input{padding:.5rem .7rem}
.csearch small{color:var(--muted);font-family:var(--mono);font-size:.65rem;white-space:nowrap}
.pin{flex:none;display:flex;gap:8px;align-items:center;border:1px solid rgba(255,216,77,.4);background:rgba(255,216,77,.07);border-radius:14px;padding:7px 12px;font-size:.82rem;cursor:pointer}
.pin span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.send .lock{background:rgba(255,216,77,.06);border:1px solid rgba(255,216,77,.3);color:var(--new);box-shadow:none;padding:0 12px}
.send .lock.on{background:rgba(255,216,77,.22)}
.send.int textarea{border-color:var(--new)}
.stars{display:flex;gap:6px;margin:6px 0 10px}
.stars button{font-size:1.6rem;background:none;border:0;color:rgba(255,255,255,.25);cursor:pointer;padding:0}
.stars button.on{color:var(--new);text-shadow:0 0 10px rgba(255,216,77,.6)}
.reason.ok{border-color:rgba(61,255,160,.45);background:rgba(61,255,160,.07)}
.reason.ok b{color:var(--done)}
.gal{position:fixed;inset:0;z-index:60;background:rgba(2,3,8,.97);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.gal img{max-width:100%;max-height:100%;transition:transform .2s}
.gal .cnt{position:absolute;top:14px;left:16px;font-family:var(--mono);color:var(--muted);font-size:.8rem}
.gal .x,.pdf .x{position:absolute;top:10px;right:14px;background:rgba(255,255,255,.1);border:0;color:#fff;font-size:1.2rem;width:38px;height:38px;border-radius:12px;cursor:pointer;z-index:2}
.gal .nv{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.08);border:0;color:#fff;font-size:1.4rem;width:38px;height:56px;border-radius:12px;cursor:pointer}
.pdf{position:fixed;inset:0;z-index:60;background:#04050b;display:flex;flex-direction:column}
.pdf iframe{flex:1;border:0;background:#fff;margin-top:56px}
.pdf a{position:absolute;top:14px;left:16px;color:var(--cyan)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

async function prepFile(file) {

    const bmp = await createImageBitmap(file), k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
    return new File([b], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch { return file; }

function openGallery(startFid) {
  const fids = $$('#chat [data-kind="image"]').map(e => e.dataset.fid); let i = Math.max(0, fids.indexOf(startFid)), scale = 1, sx = 0, lastTap = 0;
  const d = document.createElement('div'); d.className = 'gal';
  d.innerHTML = '<img alt=""><div class="cnt"></div><button class="x">✕</button><button class="nv" style="left:8px" data-d="-1">‹</button><button class="nv" style="right:8px" data-d="1">›</button>';
  document.body.appendChild(d);
  const img = d.querySelector('img');
  const show = async () => { scale = 1; img.style.transform = ''; d.querySelector('.cnt').textContent = `${i + 1}/${fids.length}`; try { img.src = URL.createObjectURL(await fileBlob(fids[i])); } catch {} };
  const step = n => { i = (i + n + fids.length) % fids.length; show(); };
  d.querySelector('.x').onclick = () => d.remove();
  d.querySelectorAll('.nv').forEach(b => { b.hidden = fids.length < 2; b.onclick = () => step(+b.dataset.d); });
  d.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  d.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - sx; if (scale === 1 && Math.abs(dx) > 60 && fids.length > 1) step(dx < 0 ? 1 : -1); });
  img.addEventListener('click', () => { const n = Date.now(); if (n - lastTap < 300) { scale = scale === 1 ? 2.4 : 1; img.style.transform = `scale(${scale})`; } lastTap = n; });
  show();
}
async function openPdf(f) {
  try {
    const url = URL.createObjectURL(await fileBlob(f.id)), d = document.createElement('div'); d.className = 'pdf';
    d.innerHTML = `<a href="${url}" download="${esc(f.name)}">${t('c_dl')}</a><button class="x">✕</button><iframe src="${url}" title="${esc(f.name)}"></iframe>`;
    d.querySelector('.x').onclick = () => d.remove(); document.body.appendChild(d);
  } catch { toast(t('c_file_err')); }
}
function renderFile(f, box, chat) {
  const kind = f.type.split('/')[0];
  box.dataset.fid = f.id; box.dataset.kind = f.type === 'application/pdf' ? 'pdf' : kind;
  if (['image','video','audio'].includes(kind)) {
    box.innerHTML = `<div class="ph">${t('c_file_load')}</div>`;
    fileBlob(f.id).then(b => {
      const el = document.createElement(kind === 'image' ? 'img' : kind); el.src = URL.createObjectURL(b);
      if (kind === 'image') { el.onclick = () => openGallery(f.id); el.onload = () => { if (chat.dataset.stick === '1') chat.scrollTop = chat.scrollHeight; }; } else el.controls = true;
      if (kind === 'video') el.playsInline = true;
      box.innerHTML = ''; box.appendChild(el);
    }).catch(() => { box.innerHTML = `<div class="ph">${t('c_file_err')}</div>`; });
  } else {
    box.innerHTML = `<button class="fbtn" data-a="dl">${f.type === 'application/pdf' ? '📕' : '📄'} <span>${esc(f.name)}</span><small>${sizeStr(f.size)}</small></button>${f.type === 'application/pdf' ? `<button class="fbtn" data-a="pv" style="margin-top:4px">👁 ${t('c_open')}</button>` : ''}`;
    box.querySelector('[data-a=dl]').onclick = async () => { try { const b = await fileBlob(f.id), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); } catch { toast(t('c_file_err')); } };
    box.querySelector('[data-a=pv]')?.addEventListener('click', () => openPdf(f));
  }
}

    }
    $('#clip').onclick = () => $('#file').click();
    $('#file').onchange = async e => {
      let f = e.target.files[0]; e.target.value = ''; if (!f) return; f = await prepFile(f);
      if (f.size > MAX_FILE) return toast(t('f_big')); toast(t('c_file_send'));
      try { const r = await uploadFile(id, f, { 'X-Caption': encodeURIComponent(ta.value.trim()) }); if (!r.ok) throw 0; add(await r.json()); ta.value = ''; ta.style.height = ''; toBottom(); } catch { toast(t('c_file_fail')); }
    };
  }
  window.__tick = () => { poll(); refresh(); };
  await poll();
  addTimer(poll, () => Date.now() - lastAct < 300000 ? 400 : 20000); // активный чат — почти мгновенно, затишье 5 минут — редко
  addTimer(refresh, 30000);
}

async function renderTchat() { // чат команды: упоминания @имя, мгновенная доставка, очередь без сети
  const main = $('#main'); main.className = 'chatmode';
  if (!TEAM) try { TEAM = await api('/team'); } catch {}
  main.innerHTML = `<div class="card chatcard"><p class="h2" style="margin:0 0 6px 4px">Чат команды</p><div class="chat" id="chat" data-stick="1"><div class="empty">${t('c_empty')}</div></div>${me.write ? `<div class="mnbar" id="mn" hidden></div><div class="send"><textarea id="txt" rows="1" maxlength="1000" placeholder="Сообщение · @имя — упомянуть"></textarea><button class="btn" id="go" aria-label="send">➤</button></div>` : '<div class="empty" style="padding:10px;margin:0">Режим просмотра</div>'}</div>`;
  const chat = $('#chat'), ta = $('#txt'), seen = new Set(); window.__onVp = () => { if (chat.dataset.stick === '1') chat.scrollTop = chat.scrollHeight; }; window.__fit?.(); let last = 0, ver = 0, polling = false, lastAct = Date.now(), lastDay = '';
  const hl = tx => esc(tx).replace(/@([\p{L}\p{N}_-]+)/gu, '<span class="mnx">@$1</span>');
  const toBottom = () => { chat.scrollTop = chat.scrollHeight; chat.dataset.stick = '1'; };
  const add = m => {
    if (seen.has(m.id)) return; if (!seen.size) chat.querySelector('.empty')?.remove(); seen.add(m.id); last = Math.max(last, m.id); lastAct = Date.now();
    if (dayKey(m.at) !== lastDay) { lastDay = dayKey(m.at); chat.insertAdjacentHTML('beforeend', `<div class="day">${dayLabel(m.at)}</div>`); }
    const mine = m.uid === me.id, el = document.createElement('div'); el.className = 'msg ' + (mine ? 'me' : 'them'); el.dataset.id = m.id;
    el.innerHTML = (mine ? '' : `<div class="nm">${esc(m.name)}</div>`) + hl(m.text) + `<small>${hm(m.at)}</small>`; chat.appendChild(el);
  };
  const addPending = it => { if (chat.querySelector(`.pend[data-cid="${it.cid}"]`)) return; chat.querySelector('.empty')?.remove(); const el = document.createElement('div'); el.className = 'msg me pend'; el.dataset.cid = it.cid; el.innerHTML = `${hl(it.body.text)}<small>⏳</small>`; chat.appendChild(el); toBottom(); };
  chat.addEventListener('scroll', () => { chat.dataset.stick = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80 ? '1' : '0'; }, { passive: true });
  window.__obSent = (it, r) => { chat.querySelectorAll(`.pend[data-cid="${it.cid}"]`).forEach(e => e.remove()); if (!r) return toast(t('c_fail')); if (it.path === '/teamchat') { add(r); toBottom(); } };
  obGet().filter(x => x.path === '/teamchat').forEach(addPending);
  const poll = async () => {
    if (polling) return; polling = true;
    try { const longp = ver && Date.now() - lastAct < 300000 && !document.hidden; const r = await api(`/teamchat?after=${last}&v=${ver}&wait=${longp ? 6 : 0}`); ver = r.v; const stick = chat.dataset.stick === '1' || !seen.size; r.m.forEach(add); if (r.m.length && stick) toBottom(); if (obGet().length) obFlush(); } catch {} finally { polling = false; }
  };
  if (ta) {
    attachMentions(ta, $('#mn'));
    const send = async () => {
      const text = ta.value.trim(); if (!text) return; ta.value = ''; ta.style.height = ''; lastAct = Date.now(); const cid = newCid();
      try { add(await api('/teamchat', { method: 'POST', body: { text, cid } })); toBottom(); } catch (e) { if (isNet(e)) { const it = { path: '/teamchat', cid, body: { text } }; obSet([...obGet(), it]); addPending(it); toast(t('q_wait')); } else { ta.value = text; toast(t('c_fail')); } }
    };
    $('#go').addEventListener('pointerdown', e => e.preventDefault()); $('#go').onclick = send; // кнопка не забирает фокус — клавиатура не закрывается
    ta.addEventListener('input', () => { lastAct = Date.now(); ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 110) + 'px'; });
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) { e.preventDefault(); send(); } });
  }
  window.__tick = poll; await poll();
  addTimer(poll, () => Date.now() - lastAct < 300000 ? 400 : 20000);
}

async function init() {
  if (!tg?.initData) {
    $('#main').innerHTML = `<div class="emptyx"><div class="ic">🔐</div><div>${t('open_bot')}</div><button class="btn" id="reopen" type="button">${t('reopen')}</button></div>`;
    const reopen = () => { try { tg.sendData('open'); } catch { tg?.close?.(); } };   // бот ответит правильной кнопкой
    $('#reopen').onclick = reopen;
    if (tg?.sendData && tg.platform && tg.platform !== 'unknown') setTimeout(reopen, 700);
    return;
  }
  try { me = await api('/me'); } catch { $('#main').innerHTML = `<div class="empty">${t('auth_fail')}</div>`; return; }
  L = me.lang || L; ls.set('lang', L); renderHeader();
  tg.BackButton?.onClick(() => go('orders'));
  api('/track', { method: 'POST', body: { e: 'open', param: tg.initDataUnsafe?.start_param || '' } }).catch(() => {});
  const m = location.hash.match(/order=(\d+)/);
  if (m) { renderNav(); return openOrder(+m[1]); }
  const h0 = location.hash.slice(1); obFlush();
  go(me.staff ? (h0 === 'tchat' ? 'tchat' : 'orders') : (h0 === 'orders' ? 'orders' : 'new'));
}
