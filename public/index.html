<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAISONAX</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#04050b;--card:rgba(15,17,26,.72);--cyan:#00f3ff;--text:#f0f3f8;--muted:#9aa4b6;--line:rgba(0,243,255,.22);
--new:#ffd84d;--prog:#00f3ff;--done:#3dffa0;--rej:#ff5d6c;
--sans:'Manrope',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(900px 500px at 80% -10%,rgba(0,243,255,.1),transparent),var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;
padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea,select{font:inherit;color:inherit}
#app{max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;letter-spacing:.04em;font-size:1.05rem}
.role{font-family:var(--mono);font-size:.72rem;color:var(--cyan);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
main{flex:1;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px}
nav{display:flex;gap:6px;padding:6px 16px 10px}
.tab,.chip{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-weight:700;font-size:.9rem}
.chip{flex:none;padding:7px 14px;font-size:.8rem;white-space:nowrap}
.tab.on,.chip.on{background:rgba(0,243,255,.12);color:var(--cyan);border-color:var(--cyan)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.order{cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.order:active{border-color:var(--cyan)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.num{font-family:var(--mono);font-weight:700}
.sub{color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.badge{font-family:var(--mono);font-size:.7rem;padding:3px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.NEW{color:var(--new)}.IN_PROGRESS{color:var(--prog)}.COMPLETED{color:var(--done)}.REJECTED{color:var(--rej)}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:5px}
input,textarea,select{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--cyan)}
select option{background:#0b0d16}
textarea{resize:none;min-height:110px}
.field{margin-bottom:12px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--cyan);color:#021014;font-weight:800;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px}
.btn:disabled{opacity:.6}
.spin{width:16px;height:16px;border:2px solid #02101480;border-top-color:#021014;border-radius:50%;animation:r .7s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.back{background:none;border:0;color:var(--cyan);font-weight:700;cursor:pointer;padding:4px 0;text-align:left}
.info{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.88rem}
.info dt{color:var(--muted)}.info dd{word-break:break-word}
.info a,.info button.lnk{color:var(--cyan);background:none;border:0;cursor:pointer;text-decoration:underline;text-align:left;padding:0}
.chat{display:flex;flex-direction:column;gap:6px;min-height:200px;max-height:42vh;overflow-y:auto;padding:4px}
.msg{max-width:82%;padding:9px 12px;border-radius:14px;font-size:.92rem;white-space:pre-wrap;word-break:break-word}
.msg small{display:block;font-family:var(--mono);font-size:.62rem;color:var(--muted);margin-top:3px}
.me{align-self:flex-end;background:rgba(0,243,255,.16);border:1px solid var(--line);border-bottom-right-radius:4px}
.them{align-self:flex-start;background:rgba(255,255,255,.07);border-bottom-left-radius:4px}
.send{display:flex;gap:8px;margin-top:8px}
.send input{flex:1}
.send button{width:auto;padding:0 18px}
.att{margin-bottom:4px}
.att img,.att video{max-width:100%;max-height:260px;border-radius:10px;display:block}
.att audio{width:100%;max-width:240px}
.att .ph{color:var(--muted);font-size:.8rem;padding:6px 0}
.fbtn{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--text);cursor:pointer;text-align:left;max-width:100%}
.fbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn small{display:inline;margin:0}
.send .clip{background:transparent;border:1px solid var(--line);color:var(--cyan);font-size:1.1rem;padding:0 12px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0b0d16;border:1px solid var(--cyan);padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:9}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
</style>
</head>
<body>
<div id="app">
  <header><span class="logo">MAISONAX</span><span class="role" id="role"></span></header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
tg?.setHeaderColor?.('#04050b'); tg?.setBackgroundColor?.('#04050b');

const STATUS = {NEW:'В ожидании',IN_PROGRESS:'В работе',COMPLETED:'Исполнен',REJECTED:'Отклонён'};
const SERVICES = ['Telegram Mini App','Чат-бот','Сайт под ключ','CRM','Автоматизация процессов','Другое'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const time = t => new Date(t).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});

let me = null, tab = 'new', filter = 'ALL', timers = [], openId = null;

async function api(path, opts = {}) {
  const r = await fetch('/api' + path, {
    ...opts,
    headers: {'Content-Type':'application/json','X-Init-Data': tg?.initData || '', ...(opts.headers||{})},
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error || r.status);
  return r.json();
}
const sizeStr = n => n > 1048576 ? (n/1048576).toFixed(1) + ' МБ' : Math.ceil(n/1024) + ' КБ';
async function fileBlob(fid) {
  const r = await fetch('/api/files/' + fid, { headers: { 'X-Init-Data': tg?.initData || '' } });
  if (!r.ok) throw new Error('file');
  return r.blob();
}
function renderFile(f, box, chat) {
  const kind = f.type.split('/')[0];
  if (['image','video','audio'].includes(kind)) {
    box.innerHTML = '<div class="ph">Загрузка…</div>';
    fileBlob(f.id).then(b => {
      const el = document.createElement(kind === 'image' ? 'img' : kind);
      el.src = URL.createObjectURL(b);
      if (kind !== 'image') el.controls = true;
      if (kind === 'video') el.playsInline = true;
      if (kind === 'image') el.onload = () => { chat.scrollTop = chat.scrollHeight; };
      box.innerHTML = ''; box.appendChild(el);
    }).catch(() => { box.innerHTML = '<div class="ph">Не удалось загрузить файл</div>'; });
  } else {
    box.innerHTML = `<button class="fbtn">📄 <span>${esc(f.name)}</span><small>${sizeStr(f.size)}</small></button>`;
    box.firstChild.onclick = async () => {
      try { const b = await fileBlob(f.id); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); }
      catch { toast('Не удалось скачать файл'); }
    };
  }
}
async function prepFile(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
    return new File([b], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch { return file; }
}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function clearTimers(){timers.forEach(clearInterval);timers=[]}
const badge = s => `<span class="badge ${s}">${STATUS[s]}</span>`;

async function init() {
  if (!tg?.initData) { $('#main').innerHTML = '<div class="empty">Откройте приложение через Telegram-бота.</div>'; return; }
  try { me = await api('/me'); } catch { $('#main').innerHTML = '<div class="empty">Не удалось авторизоваться. Перезапустите приложение.</div>'; return; }
  $('#role').textContent = me.admin ? 'admin' : 'client';
  const m = location.hash.match(/order=(\d+)/);
  if (m) { renderNav(); return openOrder(Number(m[1])); }
  go(me.admin ? 'orders' : 'new');
}

function renderNav() {
  const tabs = me.admin ? [['orders','Заказы']] : [['new','Новая заявка'],['orders','Мои заказы']];
  $('#nav').innerHTML = tabs.length > 1 ? tabs.map(([k,l]) => `<button class="tab ${tab===k?'on':''}" data-t="${k}">${l}</button>`).join('') : '';
  $('#nav').querySelectorAll('.tab').forEach(b => b.onclick = () => go(b.dataset.t));
}
function go(t) { tab = t; openId = null; clearTimers(); tg?.BackButton?.hide(); renderNav(); t === 'new' ? renderForm() : renderList(); }

/* ---- Форма заявки ---- */
function renderForm() {
  const u = tg.initDataUnsafe?.user;
  $('#main').innerHTML = `<div class="card">
    <div class="field"><label>Имя</label><input id="f-name" maxlength="80" value="${esc(u?.first_name||'')}"></div>
    <div class="field"><label>Телефон</label><input id="f-phone" type="tel" placeholder="+7 999 000 00 00"></div>
    <div class="field"><label>Услуга</label><select id="f-svc">${SERVICES.map(s=>`<option>${s}</option>`).join('')}</select></div>
    <div class="field"><label>Описание задачи</label><textarea id="f-desc" maxlength="2000" placeholder="Что нужно сделать и в какой нише работает ваш бизнес"></textarea></div>
    <button class="btn" id="f-send">Отправить заявку</button></div>`;
  $('#f-send').onclick = async e => {
    const btn = e.currentTarget;
    const body = {name:$('#f-name').value,phone:$('#f-phone').value,service_type:$('#f-svc').value,description:$('#f-desc').value};
    if (!body.name.trim() || !body.description.trim()) return toast('Заполните имя и описание');
    if (!/^\+?[\d\s()\-]{6,20}$/.test(body.phone.trim())) return toast('Проверьте номер телефона');
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Отправляем';
    try { const o = await api('/orders',{method:'POST',body}); tg.HapticFeedback?.notificationOccurred('success'); toast(`Заявка #${o.id} отправлена`); go('orders'); }
    catch { toast('Не удалось отправить. Попробуйте ещё раз'); btn.disabled = false; btn.textContent = 'Отправить заявку'; }
  };
}

/* ---- Список заказов ---- */
async function renderList() {
  const main = $('#main');
  main.innerHTML = '<div class="empty">Загрузка…</div>';
  const draw = async () => {
    if (openId || tab !== 'orders') return;
    let list; try { list = await api(me.admin ? '/orders/admin' : '/orders/my'); } catch { return; }
    const shown = list.filter(o => filter === 'ALL' ? true : filter === 'DONE' ? ['COMPLETED','REJECTED'].includes(o.status) : o.status === filter);
    const f = me.admin ? `<div class="filters">${[['ALL','Все'],['NEW','Новые'],['IN_PROGRESS','В работе'],['DONE','Завершённые']]
      .map(([k,l])=>`<button class="chip ${filter===k?'on':''}" data-f="${k}">${l}</button>`).join('')}</div>` : '';
    main.innerHTML = f + (shown.length ? shown.map(o => `<button class="card order" data-id="${o.id}">
      <div class="row"><span class="num">#${o.id}</span>${badge(o.status)}</div>
      <div class="row"><b>${esc(me.admin ? o.name : o.service_type)}</b><span class="sub">${time(o.created_at)}</span></div>
      <div class="sub">${esc(me.admin ? o.service_type + ' · ' + o.description : o.description)}</div></button>`).join('')
      : `<div class="empty">${me.admin ? 'Заказов с таким статусом нет' : 'Заказов пока нет. Оставьте первую заявку во вкладке «Новая заявка».'}</div>`);
    main.querySelectorAll('.chip').forEach(b => b.onclick = () => { filter = b.dataset.f; draw(); });
    main.querySelectorAll('.order').forEach(b => b.onclick = () => openOrder(Number(b.dataset.id)));
  };
  await draw();
  timers.push(setInterval(draw, 8000));
}

/* ---- Заказ + чат ---- */
async function openOrder(id) {
  clearTimers(); openId = id;
  tg?.BackButton?.show(); tg.BackButton.onClick(() => go('orders'));
  const main = $('#main');
  let o; try { o = await api('/orders/' + id); } catch { main.innerHTML = '<div class="empty">Заказ не найден</div>'; return; }
  let last = 0;
  const admin = me.admin;
  main.innerHTML = `<button class="back" id="back">← К заказам</button>
    <div class="card"><div class="row"><span class="num">Заказ #${o.id}</span><span id="st">${badge(o.status)}</span></div>
      <dl class="info" style="margin-top:10px">
        <dt>Клиент</dt><dd>${esc(o.name)}</dd>
        <dt>Услуга</dt><dd>${esc(o.service_type)}</dd>
        ${admin ? `<dt>Телефон</dt><dd><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a> · <button class="lnk" id="copy">копировать</button></dd>
        <dt>Telegram</dt><dd>${o.username ? `<a href="https://t.me/${esc(o.username)}" id="tgl">@${esc(o.username)}</a>` : `<a href="tg://user?id=${o.user_id}">открыть профиль</a>`}</dd>` : ''}
        <dt>Задача</dt><dd>${esc(o.description)}</dd>
      </dl>
      ${admin ? `<div class="field" style="margin:12px 0 0"><label>Статус</label><select id="status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${k===o.status?'selected':''}>${v}</option>`).join('')}</select></div>` : ''}
    </div>
    <div class="card"><div class="chat" id="chat"><div class="empty">Сообщений пока нет</div></div>
      <div class="send"><button class="btn clip" id="clip" type="button" aria-label="Прикрепить файл">📎</button><input type="file" id="file" hidden><input id="txt" maxlength="2000" placeholder="Сообщение" autocomplete="off"><button class="btn" id="go">Отправить</button></div></div>`;
  $('#back').onclick = () => go('orders');
  $('#copy')?.addEventListener('click', () => { navigator.clipboard?.writeText(o.phone); toast('Номер скопирован'); });
  $('#tgl')?.addEventListener('click', e => { if (tg?.openTelegramLink) { e.preventDefault(); tg.openTelegramLink(e.currentTarget.href); } });
  $('#status')?.addEventListener('change', async e => {
    try { const r = await api(`/orders/${id}/status`,{method:'PATCH',body:{status:e.target.value}}); $('#st').innerHTML = badge(r.status); toast('Статус обновлён, клиент уведомлён'); }
    catch { toast('Не удалось сменить статус'); }
  });
  const chat = $('#chat');
  const add = m => {
    if (!last) chat.innerHTML = '';
    last = m.id;
    const mine = admin ? m.sender_type === 'ADMIN' : m.sender_type === 'CLIENT';
    const d = document.createElement('div');
    d.className = 'msg ' + (mine ? 'me' : 'them');
    d.innerHTML = (m.file ? '<div class="att"></div>' : '') + (m.text ? esc(m.text) : '') + `<small>${time(m.created_at)}</small>`;
    if (m.file) renderFile(m.file, d.querySelector('.att'), chat);
    chat.appendChild(d);
  };
  const poll = async () => {
    try {
      const ms = await api(`/orders/${id}/messages?after=${last}`);
      if (ms.length) { const bottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80 || !last; ms.forEach(add); if (bottom) chat.scrollTop = chat.scrollHeight; }
    } catch {}
  };
  const send = async () => {
    const t = $('#txt').value.trim(); if (!t) return;
    $('#txt').value = '';
    try { await api(`/orders/${id}/messages`,{method:'POST',body:{text:t}}); await poll(); chat.scrollTop = chat.scrollHeight; }
    catch { $('#txt').value = t; toast('Сообщение не отправлено'); }
  };
  $('#go').onclick = send;
  $('#clip').onclick = () => $('#file').click();
  $('#file').onchange = async e => {
    let f = e.target.files[0]; e.target.value = ''; if (!f) return;
    f = await prepFile(f);
    if (f.size > 5 * 1024 * 1024) return toast('Файл больше 5 МБ');
    toast('Отправка файла…');
    try {
      const r = await fetch(`/api/orders/${id}/upload`, { method: 'POST', body: f, headers: {
        'X-Init-Data': tg?.initData || '', 'X-File-Name': encodeURIComponent(f.name), 'X-File-Type': f.type || 'application/octet-stream',
        'X-Caption': encodeURIComponent($('#txt').value.trim()) } });
      if (!r.ok) throw new Error();
      $('#txt').value = ''; await poll(); chat.scrollTop = chat.scrollHeight;
    } catch { toast('Не удалось отправить файл'); }
  };
  $('#txt').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  await poll();
  timers.push(setInterval(poll, 3000));
}

init();
</script>
</body>
</html>
